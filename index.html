            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #e94560;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        .name {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .title {
            color: #e94560;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .info-section {
            margin: 30px 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px 25px;
            margin: 15px 0;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .info-item:hover {
            background: rgba(233, 69, 96, 0.3);
            transform: translateX(5px);
        }

        .info-item svg {
            width: 24px;
            height: 24px;
            fill: #e94560;
            flex-shrink: 0;
        }

        .info-item span {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 400;
        }

        .social-links {
            margin-top: 35px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin: 10px 0;
        }

        .social-btn:hover {
            transform: translateY(-3px);
        }

        .social-btn svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .facebook-btn {
            background: linear-gradient(135deg, #1877f2, #0d5bbf);
            box-shadow: 0 8px 20px rgba(24, 119, 242, 0.4);
        }

        .facebook-btn:hover {
            box-shadow: 0 12px 30px rgba(24, 119, 242, 0.5);
        }

        .instagram-btn {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 8px 20px rgba(225, 48, 108, 0.4);
        }

        .instagram-btn:hover {
            box-shadow: 0 12px 30px rgba(225, 48, 108, 0.5);
        }

        .tiktok-btn {
            background: linear-gradient(135deg, #000000, #25f4ee, #fe2c55);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .tiktok-btn:hover {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            }

                height: 150px;
            }
        }
